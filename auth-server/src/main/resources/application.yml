server:
  port: ${SERVER_PORT:9000}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: auth-server

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/atlas}
    username: ${DB_USERNAME:auth_user}
    password: ${DB_PASSWORD:auth_pass}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: auth-server-pool
      data-source-properties:
        ApplicationName: auth-server

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: auth
    show-sql: false

  liquibase:
    enabled: true
    default-schema: auth
    liquibase-schema: auth
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: ${LIQUIBASE_CONTEXTS:}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:atlas}
    password: ${RABBITMQ_PASSWORD:atlas}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

outbox:
  poll-interval-ms: 5000

security:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:9000/api/v1}
    key-id: ${JWT_KEY_ID:auth-server-rsa-1}
    private-key-path: ${JWT_PRIVATE_KEY_PATH:../../platform/keys/private_key.pem}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:../../platform/keys/public_key.pem}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
    service-token-ttl-seconds: 60
  # Mapa serviceName -> secreto para POST /service-tokens. Agregar una entrada nueva aquí (sin tocar
  # código) habilita a un servicio más a pedir su JWT de servicio.
  service-secrets: {}

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}

atlas:
  openapi:
    public-access: ${OPENAPI_PUBLIC:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  messaging:
    events-exchange: auth.events
    producer: auth-server
  mail:
    from: no-reply@atlas-supplychain.local
    reset-password-url: ${RESET_PASSWORD_URL:http://localhost:5173/reset-password}
  password-policy:
    min-length: 10
    require-upper: true
    require-lower: true
    require-digit: true
    require-special: true
    history-count: 5
    expiration-days: 90
    reset-token-ttl-minutes: 20
  account-lockout:
    max-attempts: 5
    lock-minutes: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
