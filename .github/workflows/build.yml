name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configurar JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache de Gradle
        uses: gradle/actions/setup-gradle@v4

      # ./gradlew build ya incluye spotlessCheck, Error Prone, NullAway, ArchUnit,
      # integrationTest (Testcontainers; el runner trae Docker) y el umbral de JaCoCo.
      # Sin los interruptores de escape: CI siempre corre con calidad estricta y -Werror.
      - name: Build completo
        run: ./gradlew build --no-daemon

      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: auth-server/build/reports/jacoco/test
          retention-days: 14
